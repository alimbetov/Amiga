name: Worker Foundation
on:
  push:
    paths:
      - 'worker-kokoro/**'
      - '.github/workflows/worker-foundation.yml'
  pull_request:
    paths:
      - 'worker-kokoro/**'
      - '.github/workflows/worker-foundation.yml'
jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run Worker SQLite and chunker unit tests
        working-directory: worker-kokoro
        run: PYTHONPATH=. python -m unittest discover -s tests -v
